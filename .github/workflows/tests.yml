name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: buhcrm_test
          POSTGRES_USER: buhcrm
          # This password belongs only to the disposable CI database.
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buhcrm -d buhcrm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://buhcrm:ci-test-only@127.0.0.1:5432/buhcrm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
