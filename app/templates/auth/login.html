<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Вход — BuhCRM2</title>
  <link id="themeCSS" rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { min-height: 100vh; display:flex; align-items:center; justify-content:center; background:
      radial-gradient(1200px 600px at 10% 10%, rgba(13,110,253,.08), transparent),
      radial-gradient(1200px 600px at 90% 90%, rgba(32,201,151,.08), transparent);
    }
    .box { width: 380px; }
  </style>
</head>
<body>
{% if request.app.state.clone_mode %}<div role="status" style="position:fixed;top:0;left:0;right:0;z-index:2000;box-sizing:border-box;background:#ffe08a;color:#332600;text-align:center;padding:10px;font:700 15px system-ui;">ТЕСТОВЫЙ КЛОН · изменения не затрагивают рабочую CRM</div>{% endif %}
  <div class="box card shadow-lg">
    <div class="card-body p-4">
      <h4 class="mb-3"><i class="bi bi-shield-lock"></i> Вход</h4>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post" action="/login" autocomplete="off">
        <div class="mb-3">
          <label class="form-label required">Email</label>
          <input class="form-control" type="email" name="email" required />
        </div>
        <div class="mb-3">
          <label class="form-label required">Пароль</label>
          <input class="form-control" type="password" name="password" required />
        </div>
        <button class="btn btn-primary w-100" type="submit">Войти</button>
        <p class="mt-3 mb-0">
          Нет аккаунта? <a href="/register">Зарегистрировать организацию</a>
        </p>
      </form>
    </div>
  </div>
  <script>
    // темная тема по сохранению (как в base)
    (function(){const k='buhcrm2_theme',l=document.getElementById('themeCSS'),s=localStorage.getItem(k)||'flatly';
      l.href = s==='darkly'
        ? 'https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/darkly/bootstrap.min.css'
        : 'https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css';
    })();
  </script>
</body>
</html>
